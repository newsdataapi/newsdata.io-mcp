[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[project]
name = "newsdata-mcp"
dynamic = ["version"]
description = "MCP server for the NewsData.io REST API (latest/archive/crypto/market news, source discovery, aggregate counts)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "NewsData.io", email = "contact@newsdata.io" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "news",
    "newsdata",
    "api",
    "crypto",
    "market",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Framework :: Pydantic",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.28.1,<1",
    "mcp[cli]>=1.27.0,<2",
    "pydantic>=2.7.0,<3",
    "python-dotenv>=1.2.2,<2",
]

[project.scripts]
newsdata-mcp = "newsdata_mcp.server:main"

[project.urls]
Homepage = "https://newsdata.io"
Documentation = "https://newsdata.io/documentation"
Repository = "https://github.com/newsdataapi/newsdata.io-mcp"
Issues = "https://github.com/newsdataapi/newsdata.io-mcp/issues"

# Single source of truth for the version: read by hatch from
# __init__.py:__version__. Bump by editing __init__.py only.
[tool.hatch.version]
path = "src/newsdata_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/newsdata_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live API tests, opt-in via NEWSDATA_INTEGRATION_KEY env var",
]
# Skip integration tests by default; opt in with `pytest -m integration`
# or `-m ""` to run everything.
addopts = [
    "-ra",
    "--strict-markers",
    "-m", "not integration",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/newsdata_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
]

[tool.ruff.lint.per-file-ignores]
# Tests sometimes need to import-then-use private names and have long
# assertions; relax the strictest rules.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/newsdata_mcp"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
# All of our runtime deps (httpx, pydantic, mcp) ship type info, so we
# don't need to silence missing-import errors; keep mypy strict and
# let it flag any future dep that doesn't.
ignore_missing_imports = false
