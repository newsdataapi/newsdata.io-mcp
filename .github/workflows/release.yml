name: release

# Tag-triggered: build sdist + wheel, publish to PyPI via Trusted
# Publishing (OIDC, no API token), then create a GitHub Release with
# auto-generated notes and the same artifacts attached.
#
# Requires a one-time PyPI Trusted Publisher config:
#   PyPI project "newsdata-mcp" → Publishing → Add a new pending /
#   trusted publisher with
#     Owner:           newsdataapi
#     Repository:      newsdata.io-mcp
#     Workflow:        release.yml
#     Environment:     pypi

on:
  push:
    tags:
      - "v*"

# One publish per ref at a time. GitHub can deliver a tag push more than once;
# without this, two runs race and the registry rejects the loser as a duplicate
# coordinate (seen on the v0.2.0 Maven Central release).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist + wheel
        run: uv build

      - name: Show artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/newsdata-mcp
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # PyPI rejects a version that already exists, so a re-run of this
      # workflow would fail on a release that published perfectly well.
      # skip-existing turns that into a no-op.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
